intro:
  - |-
    **PAC** (*Progression Accompagnée en Chute*, the French equivalent of AFF) is the official course to become an autonomous skydiver in France. You learn to jump on your own and to manage your body position, your parachute and your safety from A to Z.
  - |-
    The course is made up of **7 levels** of jumps accompanied by one or two instructors in freefall, followed by supervised solo jumps. Each level validates specific technical skills before you move on to the next.
  - |-
    At the end of the PAC, you get your **skydiving licence** and the freedom to jump on your own at any French drop zone.

