steps:
  - title: Theory
    description: 'You study the PAC learning booklet: aerology, equipment, emergency procedures and regulations.'
    icon: tabler:book
  - title: Ground training
    description: Practical sessions on a simulator and a mock-up to master the moves before boarding the plane.
    icon: tabler:school
  - title: 'Levels 1 and 2: with two instructors'
    description: Your first two jumps from 4,000 m, with two instructors in freefall who keep you stable and guide every move.
    icon: tabler:users
  - title: 'Levels 3 to 5: with one instructor'
    description: You become more autonomous. A single instructor accompanies you in freefall to check your stability and moves.
    icon: tabler:user-check
  - title: 'Levels 6 and 7: supervised solo jumps'
    description: You jump with no instructor beside you. The instructor watches from the ground or from another plane and debriefs every jump.
    icon: tabler:parachute
  - title: Getting your licence
    description: Once all levels are validated, you get your skydiving licence and can jump on your own anywhere in France.
    icon: tabler:certificate

requirements:
  - icon: tabler:user
    label: Minimum age 15 (parental consent for minors)
  - icon: tabler:heart-rate-monitor
    label: Medical certificate of fitness required
  - icon: tabler:calendar
    label: Available over several weekends to complete the levels
