steps:
  - title: Theory class at Efrei (a few days before)
    description: 'An evening at school: skydiving basics, correct body positions, safety rules, how the parachute works and weather conditions.'
    icon: tabler:school
  - title: 'Saturday morning: arrival at the drop zone'
    description: 'Settling in, a welcome meeting and equipment collection. The atmosphere is friendly: we travel and settle in together.'
    icon: tabler:map-pin
  - title: 'Saturday: practical training on site'
    description: Simulated plane exits on the ground, training in the correct position and rehearsal of the reserve procedure. The moves are repeated until they become second nature.
    icon: tabler:repeat
  - title: The jumps
    description: Depending on the weather, jumps take place on Saturday or Sunday. An extra jump is possible on site (around €30 to €35).
    icon: tabler:wind
  - title: Canopy descent & landing
    description: 'After the opening, a calm, panoramic descent guided by radio from the ground: smooth, pleasant, almost contemplative.'
    icon: tabler:target
  - title: Night in a dormitory on site
    description: Dormitories are available and included at the drop zone. Perfect to unwind or to be ready for a jump on Sunday.
    icon: tabler:bed
  - title: 'Sunday: last jumps and return'
    description: A last jump slot depending on conditions, debrief, packing up the gear and heading back to Paris in the afternoon.
    icon: tabler:home

requirements:
  - icon: tabler:user
    label: Minimum age 15 (parental consent for minors)
  - icon: tabler:weight
    label: Weight under 95 kg
  - icon: tabler:heart-rate-monitor
    label: 'Medical certificate recommended: no cardiac or neurological contraindication'
  - icon: tabler:cloud
    label: Jumps depend on the weather and may be postponed in bad wind conditions
  - icon: tabler:shirt
    label: Comfortable clothes, trainers and thin gloves depending on the season
  - icon: tabler:bed
    label: Bring an overnight bag for the dormitory
