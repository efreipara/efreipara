intro:
  - |-
    The static line jump (**OA**, *ouverture automatique*) is the best way into skydiving: you learn the basics, understand the moves, then live a real plane exit at **1,200 metres**, with a parachute that opens automatically.
  - |-
    A **full weekend**, educational, friendly… and packed with thrills.
  - |-
    OA is designed for people who want to make a real jump without having to handle freefall on day one. You discover the sport step by step, in a safe setting with gradual teaching.

