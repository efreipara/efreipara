about:
  headline: The club
  title: Who are we?
  paragraphs:
    - |-
      **Efrei Para** is the skydiving club of the Efrei sports association (BDS), founded in **2016**. Revived in 2023 after the Covid break, the club is more active than ever, with over **100 members** on Discord.
    - |-
      We organise **tandem jumps**, **wind tunnel first flights** and **static line (OA) jumps** throughout the year.
    - 'Our goal: make skydiving accessible to students in a safe and friendly setting, with no prior experience needed.'

