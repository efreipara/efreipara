# Chaque section : surtitre (headline, en capitales au-dessus du titre) et titre
about:
  headline: Le club
  title: Qui sommes-nous ?
  paragraphs:
    - |-
      **Efrei Para** est le club de parachutisme du BDS Efrei, fondé en **2016**. Repris en 2023 après l’arrêt lié au Covid, le club est aujourd’hui plus actif que jamais avec plus de **100 membres** sur le Discord.
    - |-
      Nous organisons des **sauts en tandem**, des **baptêmes en soufflerie** et des **sauts en OA** tout au long de l’année.
    - 'Notre objectif : rendre le parachutisme accessible aux étudiants dans un cadre sécurisé et convivial, sans expérience préalable requise.'

# Chiffres sous la présentation ; le nombre en tête de title est animé, le reste est un suffixe
stats:
  - title: 100+
    description: Membres actifs sur Discord
    icon: tabler:users
  - title: '4'
    description: Activités proposées
    icon: tabler:parachute
  - title: '2016'
    description: Année de création du club
    icon: tabler:calendar

