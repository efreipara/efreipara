  link:
    label: Découvrir toutes nos activités en détail
    to: /activites

# Photo du CDN à côté des trois points forts
why:
  headline: L’esprit du club
  title: Pourquoi Efrei Para ?
  image: activites/carrousel/tandem-4
  alt: Membres d’Efrei Para en harnais à la porte de l’avion, qui embarquent avec les moniteurs de tandem
  items:
    - title: Accessible à tous
      description: >-
        Aucune expérience requise. Jamais sauté ? Simple curiosité ? On s’occupe
        de tout : briefing, équipement et encadrement.
      icon: tabler:mood-happy
      type: tandem
    - title: Encadrement professionnel
      description: >-
        Tous nos sauts sont organisés avec des moniteurs diplômés dans des centres
        agréés. La sécurité avant tout.
      icon: tabler:shield-check
      type: oa
    - title: Communauté étudiante
      description: >-
        Rejoins une équipe soudée d’étudiantes et d’étudiants de l’Efrei. Des événements
        uniques durant l’année pour vivre des expériences inoubliables ensemble.
      icon: tabler:heart
      type: soufflerie

