about:
  paragraphs:
    - |-
      <b class="text-highlighted">Efrei Para</b> est le club de parachutisme du BDS Efrei, fondé en <b class="text-highlighted">2016</b>. Repris en 2023 après l’arrêt lié au Covid, le club est aujourd’hui plus actif que jamais avec plus de <b class="text-highlighted">100 membres</b> sur le Discord.
    - |-
      Nous organisons des <b class="text-highlighted">sauts en tandem</b>, des <b class="text-highlighted">baptêmes en soufflerie</b> et des <b class="text-highlighted">sauts en OA</b> tout au long de l’année.
    - 'Notre objectif: rendre le parachutisme accessible aux étudiants dans un cadre sécurisé et convivial, sans expérience préalable requise.'

stats:
  - title: 100+
    description: Membres actifs sur Discord
    icon: tabler:users
  - title: 4
    description: Activités proposées
    icon: tabler:parachute
  - title: 2016
    description: Année de création du club
    icon: tabler:calendar

activites:
  items:
    - title: Sauts en tandem
      description: >-
        Avec un professionnel expérimenté, profite d’une expérience inoubliable
        en chute libre à 200km/h à 4000m.
      type: tandem
      to: /activites/tandem
    - title: Baptêmes en soufflerie
      description: >-
        Vole dans le tunnel en toute sécurité. Idéal pour débuter, progresser
        et s’amuser entre amis.
      type: soufflerie
      to: /activites/soufflerie
    - title: Formations PAC
      description: >-
        La Progression Accompagnée en Chute : une formation complète vers
        l’autonomie en chute libre.
      type: pac
      to: /activites/pac
    - title: Sauts en ouverture automatique (OA)
      description: >-
        Découvre le saut "vrai de vrai" : briefing, équipement, sortie d’avion
        avec ouverture automatique. Accessible et encadré.
      type: oa
      to: /activites/oa
  link:
    label: Découvrir toutes nos activités en détail
    to: /activites

why:
  - title: Accessible à tous
    description: >-
      Aucune expérience requise. Que tu sois débutant ou curieux, on s’occupe
      de tout : briefing, équipement et encadrement.
    icon: tabler:mood-happy
    type: tandem
  - title: Encadrement professionnel
    description: >-
      Tous nos sauts sont organisés avec des moniteurs diplômés dans des centres
      agréés. La sécurité avant tout.
    icon: tabler:shield-check
    type: oa
  - title: Communauté étudiante
    description: >-
      Rejoins une équipe soudée d’étudiants Efrei passionnés. Des événements
      uniques durant l’année pour vivre des expériences inoubliables ensemble.
    icon: tabler:heart
    type: soufflerie
