    icon: tabler:stairs
  - value: '~10'
    label: Sauts pour la formation complète
    icon: tabler:parachute
  - value: '1'
    label: Licence de parachutiste à la clé
    icon: tabler:certificate

steps:
  - title: Formation théorique
    description: 'Tu étudies la plaquette d’apprentissage PAC : aérologie, matériel, procédures d’urgence et réglementation.'
    icon: tabler:book
  - title: Préparation au sol
    description: Séances pratiques sur simulateur et maquette pour assimiler les gestes avant de monter en avion.
    icon: tabler:school
  - title: 'Niveaux 1 et 2 : avec deux moniteurs'
    description: Tes deux premiers sauts à 4 000 m, avec deux moniteurs en chute libre qui stabilisent et guident chaque geste.
    icon: tabler:users
  - title: 'Niveaux 3 à 5 : avec un moniteur'
    description: Tu gagnes en autonomie. Un seul moniteur t’accompagne pendant la chute libre pour valider stabilité et gestuelle.
    icon: tabler:user-check
  - title: 'Niveaux 6 et 7 : sauts solo supervisés'
    description: Tu sautes sans moniteur à tes côtés. Le moniteur observe depuis le sol ou depuis un autre avion et débriefe chaque saut.
    icon: tabler:parachute
  - title: Obtention de la licence
    description: Après validation de tous les niveaux, tu obtiens ta licence parachutiste et peux sauter en autonomie partout en France.
    icon: tabler:certificate

requirements:
  - icon: tabler:user
    label: 15 ans minimum (autorisation parentale si mineur)
  - icon: tabler:heart-rate-monitor
    label: Certificat médical de non contre-indication obligatoire
  - icon: tabler:calendar
    label: Disponibilité sur plusieurs week-ends pour enchaîner les niveaux
