features:
  - title: Formation complète
    description: Théorie, séances au sol et sauts accompagnés pour acquérir toutes les bases du vol libre.
    icon: tabler:school
  - title: Objectifs techniques
    description: Tu apprends la stabilité, la gestuelle, le pilotage et la gestion de ton parachute.
    icon: tabler:target
  - title: Autonomie progressive
    description: À chaque saut, tu gagnes en confiance jusqu’à ouvrir et contrôler ta voile en autonomie.
    icon: tabler:stairs
  - title: Licence à la clé
    description: 'La PAC aboutit à une vraie licence parachutiste : liberté de sauter partout en France.'
    icon: tabler:certificate

intro:
  - |-
    La <b class="text-highlighted">Progression Accompagnée en Chute (PAC)</b> est la formation officielle pour devenir parachutiste autonome en France. Tu apprends à sauter en autonomie, à gérer ta position, ton parachute et ta sécurité de A à Z.
  - |-
    La formation se déroule en <b class="text-highlighted">7 niveaux</b> de sauts accompagnés par un ou deux moniteurs en chute libre, suivis de sauts solo supervisés. Chaque niveau valide des compétences techniques précises avant de passer au suivant.
  - |-
    À l’issue de la PAC, tu obtiens ta <b class="text-highlighted">licence de parachutiste</b> et la liberté de sauter en autonomie dans n’importe quel centre français.

