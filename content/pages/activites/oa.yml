title: Saut en ouverture automatique (OA)
description: Vis l’adrénaline du parachutisme en solo, avec un parachute qui s’ouvre automatiquement à la sortie de l’avion.
label: OA
alt: Saut en ouverture automatique (OA) avec Efrei Para
imageCount: 0
