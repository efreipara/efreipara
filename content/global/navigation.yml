  - label: Galerie
    to: /galerie
    icon: tabler:camera
    header: 2
  - label: Nous rejoindre
    to: /rejoindre
    icon: tabler:user-plus
    header: 4
  - label: Nous contacter
    to: /contact
  - label: FAQ
    to: /faq
