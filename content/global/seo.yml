# Configuration SEO centralisée pour toutes les pages du site
# Ce fichier permet de gérer facilement les métadonnées SEO sans modifier le code des pages

# Valeurs par défaut appliquées à toutes les pages
defaults:
  siteName: Efrei Para
  separator: ' - '
  baseUrl: 'https://efreipara.fr'
  ogImage: /seo/efreipara.png
  ogType: website
  ogSiteName: Efrei Para
  twitterCard: summary_large_image
  locale: fr_FR
  themeColor: oklch(0.208 0.042 265.755005)
  author: Efrei Para
  # Seule l'accueil est indexée (voir aussi public/robots.txt)
  robots: noindex, follow

# Métadonnées spécifiques à chaque page
pages:
  # Page d’accueil
  index:
    title: Efrei Para
    description: Défiez la gravité et vivez des sensations uniques avec Efrei Para
    robots: index, follow

  # Page contact
  contact:
    title: Contact
    description: Contactez-nous pour toute question ou demande d’information sur Efrei Para

  # Page FAQ
  faq:
    title: Questions fréquentes (FAQ)
    description: Toutes les réponses à vos questions sur Efrei Para, nos activités et le parachutisme

  # Page rejoindre
  rejoindre:
    title: Nous rejoindre
    description: Découvrez comment rejoindre Efrei Para et participer à nos activités

  # Page galerie
  galerie:
    title: Nos albums photos
    description: Découvrez les moments forts d’Efrei Para en images

  # Page documents
  documents:
    title: Documents
    description: Téléchargez les documents utiles d’Efrei Para (règlement, fiches d’inscription, etc.)

  # Page activités (liste)
  activites:
    title: Nos activités
    description: 'Découvrez toutes les activités proposées par Efrei Para : OA, tandem, soufflerie et PAC'

  # Pages activités spécifiques
  activites-oa:
    title: Saut en Ouverture Automatique (OA)
    description: Découvrez le saut en ouverture automatique (OA) avec Efrei Para. Vivez l’adrénaline du parachutisme en solo avec un parachute qui s’ouvre automatiquement à la sortie de l’avion.
    ogImage: /seo/activites-oa.png

  activites-tandem:
    title: Saut en Tandem
    description: Faites votre premier saut en parachute ! Chute libre de 50 secondes à 4000m d’altitude, attaché à un moniteur professionnel. Une expérience inoubliable.
    ogImage: /seo/activites-tandem.png

  activites-soufflerie:
    title: Baptêmes en soufflerie
    description: Découvrez la sensation de chute libre en toute sécurité dans un tunnel de soufflerie. Idéal pour débuter et progresser.
    ogImage: /seo/activites-soufflerie.png

  activites-pac:
    title: Formation PAC (Progression Accompagnée en Chute)
    description: Formez-vous au parachutisme avec la méthode PAC. Une formation complète pour devenir parachutiste autonome.
    ogImage: /seo/activites-pac.png

  # Redirections réseaux sociaux
  discord:
    title: Rejoindre notre Discord
    description: Rejoignez la communauté Efrei Para sur Discord
    robots: noindex, nofollow
    ogImage: /seo/discord.png

  instagram:
    title: Notre Instagram
    description: Suivez-nous sur Instagram pour ne rien rater de nos aventures
    robots: noindex, nofollow
    ogImage: /seo/instagram.png

  # Page QR Code
  qr:
    title: QR Code
    description: Scannez notre QR Code pour accéder rapidement à nos informations
    robots: noindex, nofollow
