server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml application/wasm font/woff font/woff2;

    # En-têtes de sécurité — niveau server
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # CSP — Adaptée pour Nuxt SSG (unsafe-inline requis pour les chunks inline de Nuxt)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' ${CDN_URL}; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Routing SPA — essaie le fichier, puis index.html du dossier, puis la version .html
    location / {
        try_files $uri $uri/index.html $uri.html @notfound;
    }

    # Fallback 404
    location @notfound {
        rewrite ^ /404.html break;
    }

    # Pages d'erreur 404 (les 5xx sont gérées par Cloudflare)
    error_page 404 /404.html;

    # Page 404 sans cache — security headers
    location ~ 404.html$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' ${CDN_URL}; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Cache-Control "no-cache" always;
    }

    # Assets Nuxt hachés — cache agressif + nosniff répété
    location ~* ^/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Ressources statiques — cache agressif + nosniff répété
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|webm|mp4|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Bloquer l'accès aux fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
