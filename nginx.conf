server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml application/wasm font/woff font/woff2;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # CSP (Content Security Policy) - Adaptée pour Nuxt SSG
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' ${CDN_URL}; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Gestion du routing SPA
    location / {
        try_files $uri $uri/index.html $uri.html @notfound;
    }

    # Emplacement nommé pour les 404
    location @notfound {
        rewrite ^ /404.html break;
    }
    
    # Pages d'erreur 4xx (les 5xx sont gérées par Cloudflare)
    error_page 400 /400.html;
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;
    
    # Servir les pages d'erreur 4xx sans cache
    location ~ ^/(400|401|403|404)\.html$ {
        add_header Cache-Control "no-cache" always;
    }
    
    # Assets Nuxt avec hash - cache agressif
    location ~* ^/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache des ressources statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|webm|mp4|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Désactiver l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }
}