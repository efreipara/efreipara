server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx (header Server, pages d'erreur)
    server_tokens off;

    # Encodage explicite (évite toute interprétation d'encodage ambiguë)
    charset utf-8;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml application/wasm;

    # En-têtes de sécurité — niveau server
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # HSTS — TLS terminé par Cloudflare (Full strict), le header est transmis tel quel au navigateur.
    # Pas de includeSubDomains/preload tant que tous les sous-domaines ne sont pas garantis HTTPS à vie.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CSP — Adaptée pour Nuxt SSG (unsafe-inline requis pour les chunks inline de Nuxt).
    # img/media limités au CDN ; connect limité à Plausible (tracker bundlé, aucun script externe).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ${CDN_URL}; font-src 'self' data:; media-src 'self' ${CDN_URL}; connect-src 'self' ${PLAUSIBLE_URL}; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Routing statique — essaie le fichier, index.html du dossier, la version .html, sinon vrai 404
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Pages d'erreur : statut 404
    # et les accès interdits (403) sont masqués en 404 pour ne pas révéler l'existence des fichiers
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # Bloquer l'accès aux fichiers cachés (.env, .git, etc.)
    # Placé avant les autres regex : prioritaire même sous /_nuxt/ ou pour un .xxx.js
    location ~ /\. {
        deny all;
    }

    # Page 404 sans cache — les add_header d'un bloc location remplacent ceux du server : tout ré-ajouter
    location = /404.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ${CDN_URL}; font-src 'self' data:; media-src 'self' ${CDN_URL}; connect-src 'self' ${PLAUSIBLE_URL}; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Cache-Control "no-cache" always;
    }

    # Assets Nuxt hachés — cache agressif + nosniff répété
    location ~* ^/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Ressources statiques — cache agressif + nosniff répété
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|webm|mp4|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
