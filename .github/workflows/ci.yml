# Vérifications de docs/TESTING.md, sur les runners de GitHub : aucun secret, jeton en lecture seule.
# Les trois jobs sont obligatoires pour fusionner vers main (ruleset « main : PR obligatoire »).
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Adresses fictives : le site se génère avec vidéo, carrousels et CSP complète, et les tests e2e coupent toute
# requête externe (tests/e2e/fixtures.ts). Les vraies valeurs ne servent qu'au build de l'image déployée.
env:
  CDN_URL: https://cdn.example.org
  PLAUSIBLE_URL: https://plausible.example.org
  PLAUSIBLE_DOMAIN: efreipara.fr

jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # failOnError: false (nuxt.config.ts) : une page qui plante au prérendu disparaît sans faire échouer le build.
      - name: bun run generate
        # shell: bash active pipefail : un échec de generate n'est pas masqué par tee.
        shell: bash
        run: |
          bun run generate 2>&1 | tee generate.log
          if grep -nE '^\s*ERROR\b|Failed to prerender' generate.log; then
            echo "::error::Erreur de prérendu dans le journal de generate"
            exit 1
          fi
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Faille élevée ou critique : à traiter avant de publier (docs/SECURITY.md).
      - run: bun audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker build -t efreipara-ci
          --build-arg CDN_URL --build-arg PLAUSIBLE_URL --build-arg PLAUSIBLE_DOMAIN .
      - name: Conteneur et en-têtes nginx
        shell: bash
        run: |
          docker run -d --name efreipara -p 8080:8080 efreipara-ci
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          test "$(status /)" = 200
          curl -sI http://127.0.0.1:8080/ | grep -i '^content-security-policy:.*cdn\.example\.org'
          test "$(status /page-inexistante)" = 404
          test "$(status /.env)" = 404
      - if: failure()
        run: docker logs efreipara
